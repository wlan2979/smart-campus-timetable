spring:
  datasource:
    url: jdbc:h2:mem:campustest;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: test-only-super-secret-jwt-key-minimum-32-characters-long
  sms:
    provider: debug_log
    rate-limit-seconds: 1
